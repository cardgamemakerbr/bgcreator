{% extends 'base.html' %}

{% block title %}Editar Componente - BGCreator{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-puzzle-piece"></i> Editar Componente</h2>
    <a href="{% url 'componentes_lista' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Voltar
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nome do Componente *</label>
                <input type="text" class="form-control" name="nome" value="{{ item.nome }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <select class="form-select" name="tipo">
                    <option value="TATICO" {% if item.tipo == 'TATICO' %}selected{% endif %}>Tático</option>
                    <option value="SORTE" {% if item.tipo == 'SORTE' %}selected{% endif %}>Sorte</option>
                    <option value="LUDICO" {% if item.tipo == 'LUDICO' %}selected{% endif %}>Lúdico</option>
                    <option value="HABILIDADE" {% if item.tipo == 'HABILIDADE' %}selected{% endif %}>Habilidade</option>
                    <option value="GERENCIAMENTO" {% if item.tipo == 'GERENCIAMENTO' %}selected{% endif %}>Gerenciamento</option>
                    <option value="NEUTRO" {% if item.tipo == 'NEUTRO' %}selected{% endif %}>Neutro</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea class="form-control" name="descricao" rows="3">{{ item.descricao }}</textarea>
            </div>
            <div class="text-end">
                <button type="submit" class="btn btn-warning">
                    <i class="fas fa-save"></i> Atualizar Componente
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Novo Componente - BGCreator{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-puzzle-piece"></i> Novo Componente</h2>
    <a href="{% url 'componentes_lista' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Voltar
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label class="form-label">Nome do Componente *</label>
                        <input type="text" class="form-control" name="nome" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select class="form-select" name="tipo">
                            <option value="TATICO" selected>Tático</option>
                            <option value="SORTE">Sorte</option>
                            <option value="LUDICO">Lúdico</option>
                            <option value="HABILIDADE">Habilidade</option>
                            <option value="GERENCIAMENTO">Gerenciamento</option>
                            <option value="NEUTRO">Neutro</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea class="form-control" name="descricao" rows="3"></textarea>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label">Imagem do Componente</label>
                        <input type="file" class="form-control" name="imagem" accept="image/*">
                        <small class="text-muted">Formato quadrado pequeno recomendado (ex: 64x64px)</small>
                    </div>
                </div>
            </div>
            <div class="text-end">
                <button type="submit" class="btn btn-warning">
                    <i class="fas fa-save"></i> Salvar Componente
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

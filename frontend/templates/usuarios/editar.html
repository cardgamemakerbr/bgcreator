{% extends 'base.html' %}

{% block title %}Editar Usuário - BGCreator{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-user-edit"></i> Editar Usuário</h2>
    <a href="{% url 'usuarios_lista' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Voltar
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Nome do Usuário *</label>
                        <input type="text" class="form-control" name="nome" value="{{ usuario.nome }}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Login *</label>
                        <input type="text" class="form-control" name="login" value="{{ usuario.login }}" required>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-12">
                    <div class="mb-3">
                        <label class="form-label">E-mail *</label>
                        <input type="email" class="form-control" name="email" value="{{ usuario.email }}" required>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-12">
                    <div class="mb-3">
                        <label class="form-label">Avatar</label>
                        {% if usuario.avatar %}
                            <div class="mb-2">
                                <img src="{{ usuario.avatar }}" alt="Avatar atual" class="img-thumbnail" style="max-width: 100px; max-height: 100px;">
                                <input type="hidden" name="avatar_existente" value="{{ usuario.avatar }}">
                                <div class="form-text">Avatar atual</div>
                            </div>
                        {% endif %}
                        <input type="file" class="form-control" name="avatar" accept="image/*">
                        <div class="form-text">Selecione uma nova imagem para alterar o avatar</div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Perfil *</label>
                        <select class="form-select" name="perfil" required>
                            <option value="LEITOR" {% if usuario.perfil == 'LEITOR' %}selected{% endif %}>Leitor</option>
                            <option value="AUTOR" {% if usuario.perfil == 'AUTOR' %}selected{% endif %}>Autor</option>
                            <option value="REVISOR" {% if usuario.perfil == 'REVISOR' %}selected{% endif %}>Revisor</option>
                            <option value="ADMINISTRADOR" {% if usuario.perfil == 'ADMINISTRADOR' %}selected{% endif %}>Administrador</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="ativo" {% if usuario.ativo %}checked{% endif %}>
                            <label class="form-check-label">Ativo</label>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Nova Senha (deixe em branco para manter)</label>
                        <input type="password" class="form-control" name="senha">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Confirmação de Nova Senha</label>
                        <input type="password" class="form-control" name="confirma_senha">
                    </div>
                </div>
            </div>
            
            <div class="text-end">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fas fa-save"></i> Salvar Alterações
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

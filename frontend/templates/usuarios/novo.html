{% extends 'base.html' %}

{% block title %}Novo Usuário - BGCreator{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-user-plus"></i> Novo Usuário</h2>
    <a href="{% url 'usuarios_lista' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Voltar
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Nome do Usuário *</label>
                        <input type="text" class="form-control" name="nome" id="nome" required autocomplete="off">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Login *</label>
                        <input type="text" class="form-control" name="login" id="login" required autocomplete="off" value="">
                        <div class="form-text">Sugestão será gerada automaticamente baseada no nome</div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-12">
                    <div class="mb-3">
                        <label class="form-label">E-mail *</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-12">
                    <div class="mb-3">
                        <label class="form-label">Avatar</label>
                        <input type="file" class="form-control" name="avatar" accept="image/*">
                        <div class="form-text">Imagem do perfil do usuário (opcional)</div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Perfil *</label>
                        <select class="form-select" name="perfil" required>
                            <option value="LEITOR">Leitor</option>
                            <option value="AUTOR">Autor</option>
                            <option value="REVISOR">Revisor</option>
                            <option value="ADMINISTRADOR">Administrador</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="ativo" checked>
                            <label class="form-check-label">Ativo</label>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Senha *</label>
                        <input type="password" class="form-control" name="senha" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Confirmação de Senha *</label>
                        <input type="password" class="form-control" name="confirma_senha" required>
                    </div>
                </div>
            </div>
            
            <div class="text-end">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fas fa-save"></i> Salvar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
// Função para gerar sugestão de login baseada no nome
function gerarSugestaoLogin(nome) {
    if (!nome.trim()) return '';
    
    return nome.trim()
        .toLowerCase()
        .replace(/\s+/g, '.')  // Substituir espaços por pontos
        .replace(/[^a-z0-9.]/g, '')  // Remover caracteres especiais exceto pontos
        .replace(/\.+/g, '.')  // Substituir múltiplos pontos por um só
        .replace(/^\.|\.$/, '');  // Remover pontos do início e fim
}

// Garantir que o campo login inicie vazio quando a página carregar
document.addEventListener('DOMContentLoaded', function() {
    const loginField = document.getElementById('login');
    loginField.value = '';  // Forçar campo vazio
    
    // Adicionar evento ao campo nome
    document.getElementById('nome').addEventListener('input', function() {
        const nome = this.value;
        
        // Só sugerir se o campo login estiver vazio ou com sugestão anterior
        if (!loginField.dataset.userEdited) {
            loginField.value = gerarSugestaoLogin(nome);
        }
    });
    
    // Marcar quando usuário editar manualmente o login
    loginField.addEventListener('input', function() {
        this.dataset.userEdited = 'true';
    });
    
    // Limpar marcação se campo ficar vazio
    loginField.addEventListener('blur', function() {
        if (!this.value.trim()) {
            delete this.dataset.userEdited;
        }
    });
});
</script>
{% endblock %}
